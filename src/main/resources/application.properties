spring.application.name=veterinaria-backend
server.port=8080

# Base de datos: los secretos vienen de variables de entorno, nunca del código
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:veterinaria_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:veterinaria_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: la clave debe tener 32 caracteres o más. El token dura 2 horas (en milisegundos)
jwt.secret=${JWT_SECRET}
jwt.expiration=7200000

# Origen(es) del frontend que pueden llamar a la API (CORS), separados por coma
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}

springdoc.swagger-ui.path=/swagger-ui.html
