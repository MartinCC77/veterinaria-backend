spring.application.name=veterinaria-backend

# Conexión a MySQL. Los datos secretos vienen de variables de entorno, nunca del código
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:usuarios_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:usuarios_app}
spring.datasource.password=${DB_PASSWORD}

# Hibernate crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=8080